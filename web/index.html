<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
{{if .Public}}<link rel="canonical" href="{{.Public}}/">{{else}}<meta name="robots" content="noindex">{{end}}
<title>hippomaps</title>
<meta name="description" content="Search places on OpenStreetMap in plain words, with pictures and details beside the map.">
<link rel="icon" href="{{asset "icon-32.png"}}" type="image/png" sizes="32x32">
<link rel="icon" href="{{asset "icon-192.png"}}" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="{{asset "apple-touch-icon.png"}}">
<link rel="stylesheet" href="{{asset "vendor/maplibre-gl-6.13.0/maplibre-gl.css"}}">
<link rel="stylesheet" href="{{asset "app.css"}}">
<link rel="modulepreload" href="{{asset "vendor/maplibre-gl-6.13.0/maplibre-gl.mjs"}}">
{{with .Tiles}}<link rel="preconnect" href="{{.}}" crossorigin>{{end}}
</head>
<body>
<div class="lm" id="app" data-logo="{{asset "icon-192.png"}}" data-overpass="{{asset "overpass-logo.png"}}" data-overpass-dark="{{asset "overpass-logo-dark.png"}}" data-api="{{.SearchAPI}}" data-tiles="{{.Tiles}}" data-key="{{.Key}}"{{if .Pictures}} data-pictures="{{.Base}}/api/picture"{{end}}{{if .Routes}} data-route="{{.Base}}/api/route"{{end}}{{if .Say}} data-say="{{.Base}}/api/say" data-voices="{{.Voices}}"{{end}}{{if .Traffic}} data-traffic="{{.Base}}/api/traffic"{{end}}{{if .Transit}} data-transit="{{.Base}}/api/transit"{{end}}{{if .Along}} data-along="{{.Base}}/api/along"{{end}}{{if .Donate}} data-donate="{{.Base}}/api/donate"{{end}} data-privacy="{{.Base}}/privacy" data-sw="{{.Base}}/sw.js" data-scope="{{.Scope}}"{{with .Near}} data-near="{{.}}"{{end}}>
  <aside class="lm-side" aria-label="Search and results"></aside>
  <main class="lm-map" aria-label="Map"></main>
</div>
<noscript><p class="lm-noscript">The map needs JavaScript.</p></noscript>
<script type="module" src="{{asset "app.js"}}"></script>
</body>
</html>
